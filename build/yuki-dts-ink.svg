<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <filter id="inkBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="inkSpread" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="50%" style="stop-color:#2d2d2d"/>
      <stop offset="100%" style="stop-color:#4a4a4a"/>
    </linearGradient>
    <radialGradient id="inkWash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#666666" stop-opacity="0.1"/>
      <stop offset="70%" style="stop-color:#888888" stop-opacity="0.05"/>
      <stop offset="100%" style="stop-color:#aaaaaa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="#f5f0e6"/>

  <ellipse cx="300" cy="200" rx="260" ry="160" fill="url(#inkWash)" filter="url(#inkSpread)"/>
  <ellipse cx="300" cy="200" rx="200" ry="120" fill="url(#inkWash)" filter="url(#inkSpread)"/>

  <g filter="url(#inkBlur)">
    <path d="M60,320 Q120,300 180,320 Q240,340 300,320 Q360,300 420,320 Q480,340 540,320"
          stroke="#333333" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M80,340 Q160,330 240,345 Q320,360 400,345 Q480,330 520,340"
          stroke="#555555" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <g filter="url(#inkBlur)">
    <path d="M480,60 Q460,100 480,150 Q500,200 480,250"
          stroke="#444444" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M470,80 Q490,120 470,170"
          stroke="#555555" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.4"/>
    <path d="M490,100 Q470,140 490,190"
          stroke="#666666" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <g filter="url(#inkBlur)">
    <ellipse cx="100" cy="80" rx="40" ry="25" fill="#777777" opacity="0.25" filter="url(#inkSpread)"/>
    <ellipse cx="140" cy="70" rx="35" ry="20" fill="#888888" opacity="0.2" filter="url(#inkSpread)"/>
    <ellipse cx="80" cy="90" rx="30" ry="18" fill="#999999" opacity="0.15" filter="url(#inkSpread)"/>
  </g>

  <text x="300" y="210" font-family="'Noto Serif SC', 'SimSun', 'KaiTi', serif"
        font-size="110" font-weight="bold" fill="url(#inkGradient)"
        text-anchor="middle" letter-spacing="16" filter="url(#inkBlur)">
    YUKI
  </text>

  <text x="300" y="280" font-family="'Noto Serif SC', 'SimSun', 'KaiTi', serif"
        font-size="42" fill="#3a3a3a"
        text-anchor="middle" letter-spacing="12" opacity="0.85">
    DTS
  </text>

  <circle cx="120" cy="360" r="20" fill="none" stroke="#555555" stroke-width="2" opacity="0.3"/>
</svg>
